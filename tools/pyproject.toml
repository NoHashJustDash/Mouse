# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mouse-tools"
version = "1.0.0"
description = "Verified network and development tools for the Mouse chess engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["build==1.2.2.post1", "mypy==1.15.0", "pytest==8.3.5", "ruff==0.11.12"]
onnx = ["numpy==2.2.6", "onnx==1.18.0"]
cpu = ["numpy==2.2.6", "onnx==1.18.0", "onnxruntime==1.22.0"]
converter = ["numpy==2.2.6", "onnx==1.18.0", "onnxruntime==1.22.0", "torch==2.14.1+cpu"]
gpu = ["numpy==2.2.6", "onnx==1.18.0", "onnxruntime-gpu==1.22.0; sys_platform == 'win32'", "tensorrt==10.9.0.34; sys_platform == 'win32'"]

[tool.hatch.build.targets.wheel]
packages = ["src/mouse_tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
